<div class="min-h-screen bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">

    <div class="mb-8">
      <h2 class="text-3xl font-semibold text-slate-900">Manage Items</h2>
      <p class="text-sm text-slate-500 mt-2 max-w-2xl">Create, view, and modify your records in a clean responsive
        layout.</p>
    </div>

    <div class="grid gap-8">
      <section class="bg-white rounded-[28px] shadow-sm border border-slate-200 p-6">
        <div class="grid gap-6 lg:grid-cols-[1.4fr_0.6fr] items-end">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Item Name</label>
            <input type="text" [(ngModel)]="formData.name" name="name" placeholder="e.g. Premium Plan"
              class="w-full px-4 py-3 text-slate-900 border border-slate-300 rounded-2xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Description</label>
            <input type="text" [(ngModel)]="formData.description" name="description" placeholder="Enter details..."
              class="w-full px-4 py-3 text-slate-900 border border-slate-300 rounded-2xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200" />
          </div>
        </div>

        <div class="mt-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div class="text-sm text-slate-500">Fill in the fields and save your item.</div>
          <div class="flex justify-end">
            @if(selectedId) {
            <button (click)="update()"
              class="inline-flex items-center justify-center px-6 py-3 text-sm font-semibold text-white bg-slate-900 rounded-2xl hover:bg-slate-800 focus:ring-4 focus:ring-slate-200 transition duration-200 shadow-sm">
              Update Item
            </button>
            } @else {
            <button (click)="create()"
              class="inline-flex items-center justify-center px-6 py-3 text-sm font-semibold text-white bg-blue-600 rounded-2xl hover:bg-blue-700 focus:ring-4 focus:ring-blue-100 transition duration-200 shadow-sm">
              Save Item
            </button>
            }
          </div>
        </div>
      </section>

      <section class="bg-white rounded-[28px] shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-500 uppercase text-xs tracking-[0.18em] border-b border-slate-200">
              <tr>
                <th class="px-6 py-4 font-semibold">ID</th>
                <th class="px-6 py-4 font-semibold">Name</th>
                <th class="px-6 py-4 font-semibold">Description</th>
                <th class="px-6 py-4 font-semibold text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-slate-700">
              @for(item of items; track item.id) {
              <tr class="hover:bg-slate-50/80 transition-colors duration-150">
                <td class="px-6 py-4 font-medium text-slate-900">{{ item.id }}</td>
                <td class="px-6 py-4">{{ item.name }}</td>
                <td class="px-6 py-4 max-w-[24rem] truncate text-slate-500">{{ item.description }}</td>
                <td class="px-6 py-4 text-right">
                  <button (click)="edit(item)"
                    class="inline-flex items-center justify-center px-3 py-1.5 mr-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-blue-50 transition duration-200">
                    Edit
                  </button>
                  <button (click)="delete(item.id)"
                    class="inline-flex items-center justify-center px-3 py-1.5 text-sm font-medium text-red-600 rounded-lg hover:bg-red-50 transition duration-200">
                    Delete
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>
