<mat-toolbar class="bg-white! border-b border-slate-200 h-16 px-6 flex justify-between items-center sticky top-0 z-10">
  <div class="flex items-center flex-1 max-w-xl">
    <div class="relative w-full group">
      <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">search</mat-icon>
      <input type="text"
             placeholder="Search employees, tasks, or documents..."
             class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button mat-icon-button class="text-slate-500 hover:bg-slate-50!">
      <mat-icon class="relative">
        notifications
        <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 border-2 border-white rounded-full"></span>
      </mat-icon>
    </button>

    <button mat-icon-button class="text-slate-500 hover:bg-slate-50!">
      <mat-icon>settings</mat-icon>
    </button>

    <div class="h-8 w-[1px] bg-slate-200 mx-2"></div>

    <button mat-button class="flex items-center gap-2 px-2 hover:bg-slate-50! rounded-lg">
      <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff"
           alt="Avatar"
           class="w-8 h-8 rounded-lg shadow-sm">
      <div class="hidden md:flex flex-col items-start leading-tight">
        <span class="text-xs font-bold text-slate-800 uppercase tracking-tight">Admin User</span>
        <span class="text-[10px] text-slate-500">Super Admin</span>
      </div>
      <mat-icon class="text-slate-400 scale-75">expand_more</mat-icon>
    </button>
  </div>
</mat-toolbar>
