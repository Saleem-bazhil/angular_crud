<div class="flex flex-col h-full bg-slate-950 text-slate-300">
  <!-- Sidebar Header -->
  <div class="p-6 flex items-center gap-3 border-b border-slate-800">
    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-900/20">
      <mat-icon class="text-white text-lg scale-75">admin_panel_settings</mat-icon>
    </div>
    <span class="text-lg font-bold tracking-tight text-white">Employee CRM</span>
  </div>

  <!-- Navigation Section -->
  <div class="flex-1 overflow-y-auto py-6 px-4 custom-scrollbar">
    <nav class="space-y-1">
      <div class="px-3 pb-2 text-[11px] font-bold text-slate-500 uppercase tracking-widest">
        Main Menu
      </div>

      <a routerLink="/dashboard"
         routerLinkActive="active-link"
         class="nav-item group">
        <mat-icon class="nav-icon">dashboard</mat-icon>
        <span class="font-medium">Dashboard</span>
      </a>

      <a routerLink="/employees"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{exact: false}"
         class="nav-item group">
        <mat-icon class="nav-icon">groups</mat-icon>
        <span class="font-medium">Employees</span>
      </a>

      <a routerLink="/employees/add"
         routerLinkActive="active-link"
         class="nav-item group">
        <mat-icon class="nav-icon">person_add</mat-icon>
        <span class="font-medium">Add Employee</span>
      </a>

      <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-slate-500 uppercase tracking-widest">
        Development
      </div>

      <a routerLink="/crud-first"
         routerLinkActive="active-link"
         class="nav-item group">
        <mat-icon class="nav-icon">terminal</mat-icon>
        <span class="font-medium">CRUD First</span>
      </a>
    </nav>
  </div>

  <!-- User Profile Section -->
  <div class="p-4 mt-auto border-t border-slate-800 bg-slate-950/50 backdrop-blur-sm">
    <div class="flex items-center gap-3 px-2 py-3 rounded-xl hover:bg-slate-900/80 transition-all duration-200 cursor-pointer group">
      <div class="relative">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-blue-700 to-blue-500 flex items-center justify-center text-white font-bold text-sm shadow-md group-hover:scale-105 transition-transform">
          AD
        </div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-slate-950 rounded-full"></div>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-sm font-semibold text-white truncate">Admin User</span>
        <span class="text-xs text-slate-500 truncate">admin@crm.com</span>
      </div>
      <mat-icon class="ml-auto text-slate-600 text-sm group-hover:text-slate-400 transition-colors">more_vert</mat-icon>
    </div>
  </div>
</div>
